function showLoading() { $('#global-loader').classList.remove('hidden'); }

function toggleLang() { appState.lang = appState.lang === 'en' ? 'pt' : 'en'; render(); }
function toast(msg, type = 'success') {
    const container = $('#toast-container');
    const toast = document.createElement('div');
    toast.className = `${type === 'success' ? 'bg-green-500' : type === 'warning' ? 'bg-yellow-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg font-bold fade-in`;

}
function showModal(content) {

        <div class="fixed inset-0 modal-overlay z-40 flex items-center justify-center p-4 fade-in" onclick="closeModal()">

}
function closeModal() { $('#modal-container').innerHTML = ''; }
function changeView(view) { appState.currentView = view; render(); }

// ============================================
// 2. AUTH & DB FETCH
// ============================================
async function handleLogin(e) {
    e.preventDefault();
    const email = $('#loginEmail').value.trim();
    const pass = $('#loginPass').value;
    
    showLoading();
    const { data: users, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('email', email)
        .eq('password', pass)
        .limit(1);

    const user = users && users.length > 0 ? users[0] : null;

    if (error || !user) {
        hideLoading();
        toast('Credenciais inválidas', 'error');
        return;
    }

    appState.currentUser = user;
    appState.currentView = 'dashboard';
    await refreshData();
    hideLoading();
    render();
}

function handleLogout() { appState.currentUser = null; render(); }

async function refreshData() {
    if (!appState.currentUser) return;
    const uId = appState.currentUser.id;
    const role = appState.currentUser.role;

    try {
        const { data: loja } = await supabaseClient.from('loja').select('*');
        appState.loja = loja || [];

        // NOVO: Tentar buscar histórico de inflação do banco
        const { data: hist, error: histErr } = await supabaseClient.from('inflacao_historico').select('*').order('created_at', { ascending: true });
        if (!histErr && hist && hist.length > 0) {
            appState.inflacaoHistorico = hist;
            appState.inflationRate = hist[hist.length - 1].taxa;
        } else if (appState.inflacaoHistorico.length === 0) {
            // Rede de segurança: Se a tabela não existir, usa um valor padrão inicial na memória
            appState.inflacaoHistorico = [{ taxa: 1.0, created_at: new Date().toISOString() }];
            appState.inflationRate = 1.0;
        }

        if (role === 'teacher') {
            const { data: users } = await supabaseClient.from('users').select('*').eq('role', 'student');
            appState.users = users || [];

            const { data: transacoes } = await supabaseClient.from('transacoes').select('*');
            appState.transacoes = transacoes || [];

            const { data: solicitacoes } = await supabaseClient.from('solicitacoes_item').select('*');
            appState.solicitacoes = solicitacoes || [];
        } else {
            const { data: userData } = await supabaseClient.from('users').select('saldo').eq('id', uId).limit(1);
            if (userData && userData.length > 0) appState.currentUser.saldo = userData[0].saldo;

            const { data: transacoes } = await supabaseClient.from('transacoes').select('*').eq('aluno_id', uId);
            appState.transacoes = transacoes || [];

            const { data: solicitacoes } = await supabaseClient.from('solicitacoes_item').select('*').eq('aluno_id', uId);
            appState.solicitacoes = solicitacoes || [];
        }
    } catch (err) {
        toast('Falha ao carregar dados', 'error');
        console.error(err);
    }
}

// NOVO: Função responsável por desenhar o gráfico
function renderCharts() {
    const ctx = document.getElementById('inflationChart');
    if (!ctx) return; // Se não houver canvas (ex: noutra página), não faz nada
    
    // Limpar gráfico anterior se existir (previne sobreposições visuais)
    if (window.inflationChartInstance) {
        window.inflationChartInstance.destroy();
    }

    const labels = appState.inflacaoHistorico.map(h => {
        const d = new Date(h.created_at);
        return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    });
    const data = appState.inflacaoHistorico.map(h => h.taxa);
    
    window.inflationChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Taxa de Inflação',
                data: data,
                borderColor: '#8B5CF6', // Roxo (Tailwind purple-500)
                backgroundColor: 'rgba(139, 92, 246, 0.2)',
                borderWidth: 3,
                tension: 0.3, // Suaviza a linha (curva)
                fill: true,
                pointBackgroundColor: '#8B5CF6',
                pointRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: false, min: 0.5, max: 2.5 } }
        }
    });
}

// CARREGAR/SINCRONIZAR ALUNOS E SALDOS (CSV)
async function handleCSVUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    showLoading();
    const reader = new FileReader();
    reader.onload = async function(e) {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);
        
        let newUsers = [];
        let updates = [];
        let transactions = [];
        let notFoundSemNome = 0;

        if (lines.length > 0) {
            const delimiter = lines[0].includes(';') ? ';' : ',';
            const headers = lines[0].toLowerCase().split(delimiter).map(h => h?.trim());
            
            let nomeIdx = headers.indexOf('nome');
            let emailIdx = headers.indexOf('email');
            let turmaIdx = headers.indexOf('turma');
            if (turmaIdx === -1) turmaIdx = headers.indexOf('grupo');
            let valorIdx = headers.indexOf('valor');
            if (valorIdx === -1) valorIdx = headers.indexOf('saldo');

            if (nomeIdx === -1) nomeIdx = 0;
            if (emailIdx === -1) emailIdx = 1;

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(delimiter).map(s => s?.trim());
                
                const nome = cols[nomeIdx];
                const email = cols[emailIdx];
                const turmaStr = turmaIdx !== -1 ? cols[turmaIdx] : null;
                
                // Tratar a coluna do valor (substituir vírgula por ponto para parse correto)
                const valorStr = valorIdx !== -1 && cols[valorIdx] ? cols[valorIdx].replace(',', '.') : '0';
                const valor = parseFloat(valorStr) || 0;

                // Verificação base: o e-mail tem de existir e ser do domínio do SESI
                if (email && email.endsWith('@portalsesisp.org.br')) {
                    const existingStudent = appState.users.find(u => u.email === email && u.role === 'student');

                    if (existingStudent) {
                        // 1. O Aluno já existe. Apenas atualizamos o saldo, se necessário.
                        if (valor !== 0) {
                            const novoSaldo = existingStudent.saldo + valor;
                            updates.push({ id: existingStudent.id, saldo: novoSaldo });
                            transactions.push({
                                id: generateId(),
                                aluno_id: existingStudent.id,
                                tipo: valor > 0 ? 'credito' : 'debito',
                                valor: Math.abs(valor),
                                descricao: 'Atualização via CSV'
                            });
                        }
                    } else {
                        // 2. O Aluno NÃO existe. Precisamos criar.
                        // Para criar, exigimos que haja um NOME preenchido na linha.
                        if (nome) {
                            const newId = generateId();
                            newUsers.push({ 
                                id: newId, 
                                role: 'student', 
                                nome: nome, 
                                email: email, 
                                password: '123', 
                                saldo: valor > 0 ? valor : 0, // Ignoramos valores iniciais negativos em contas novas
                                turma: turmaStr 
                            });
                            
                            // Se já começou com saldo positivo, regista no log da conta dele
                            if (valor > 0) {
                                transactions.push({
                                    id: generateId(),
                                    aluno_id: newId,
                                    tipo: 'credito',
                                    valor: valor,
                                    descricao: 'Depósito inicial via CSV'
                                });
                            }
                        } else {
                            // Encontrou e-mail que não existe no DB, mas não tem nome para poder criar.
                            notFoundSemNome++;
                        }
                    }
                }
            }
        }

        // Executar todas as operações necessárias no banco de dados (Supabase)
        let promises = [];
        
        if (newUsers.length > 0) {
            promises.push(supabaseClient.from('users').insert(newUsers));
        }
        
        if (updates.length > 0) {
            const updatePromises = updates.map(u => supabaseClient.from('users').update({ saldo: u.saldo }).eq('id', u.id));
            promises.push(...updatePromises);
        }
        
        if (transactions.length > 0) {
            promises.push(supabaseClient.from('transacoes').insert(transactions));
        }

        if (promises.length > 0) {
            await Promise.all(promises);
            toast(`${newUsers.length} novos alunos e ${updates.length} atualizados!`);
            if (notFoundSemNome > 0) toast(`${notFoundSemNome} ignorados (sem nome).`, 'warning');
        } else {
            toast('Nenhuma alteração válida encontrada.', 'warning');
        }

        await refreshData();
        hideLoading();
        render();
        event.target.value = '';
    };
    reader.readAsText(file);
}

async function handleRequest(reqId, action) {
    showLoading();
    const req = appState.solicitacoes.find(s => s.id === reqId);
    if (!req) { hideLoading(); return; }
    await supabaseClient.from('solicitacoes_item').update({ status: action }).eq('id', reqId);
    if (action === 'rejeitado') {
        const aluno = appState.users.find(u => u.id === req.aluno_id);
        if(aluno) {
            const newSaldo = aluno.saldo + parseFloat(req.preco_pago);
            await supabaseClient.from('users').update({ saldo: newSaldo }).eq('id', aluno.id);
            await supabaseClient.from('transacoes').insert([{ id: generateId(), aluno_id: aluno.id, tipo: 'credito', valor: req.preco_pago, descricao: 'Reembolso por pedido rejeitado' }]);
        }
    }
    toast(`Solicitação ${action === 'aprovado' ? 'Aprovada' : 'Rejeitada'}`);
    await refreshData();
    hideLoading();
    render();
}

                <div class="flex items-center gap-4"><div class="w-10 h-10 bg-gray-50 rounded-lg flex items-center justify-center"><i data-lucide="package" class="w-5 h-5 text-gray-400"></i></div><div><p class="font-bold text-gray-800">${item?.nome || 'Item removido'}</p><p class="text-xs text-gray-400">${fmtCurrency(s.preco_pago)}</p></div></div>
                ${statusTag}
            </div>`;
    };
    return `
    <div class="fade-in space-y-8">
        <div><h2 class="text-2xl font-black text-gray-800 mb-4">${t('pending_items')}</h2><div class="space-y-3">${pendentes.length === 0 ? '<p class="text-gray-400 italic">Sem itens pendentes.</p>' : ''}${pendentes.map(s => renderCard(s, `<span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-lg text-xs font-bold uppercase">Pendente</span>`)).join('')}</div></div>
        <div><h2 class="text-2xl font-black text-gray-800 mb-4">${t('acquired_items')}</h2><div class="space-y-3">${aprovados.length === 0 ? '<p class="text-gray-400 italic">Nenhum item adquirido ainda.</p>' : ''}${aprovados.map(s => renderCard(s, `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-xs font-bold uppercase"><i data-lucide="check" class="w-3 h-3 inline"></i> Adquirido</span>`)).join('')}</div></div>
    </div>`;
}

function renderStudentHistory() {
    const history = appState.transacoes.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    return `
    <div class="fade-in space-y-4 md:space-y-6 w-full">
        <h1 class="text-2xl md:text-3xl font-black text-gray-800">${t('nav_history')}</h1>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 w-full">
            <div class="overflow-x-auto w-full rounded-2xl">
                <table class="w-full text-left whitespace-nowrap min-w-[500px]">
                    <thead class="bg-gray-50"><tr><th class="p-4 text-xs font-bold text-gray-500 uppercase">Tipo</th><th class="p-4 text-xs font-bold text-gray-500 uppercase">Descrição</th><th class="p-4 text-xs font-bold text-gray-500 uppercase text-right">Valor</th></tr></thead>
                    <tbody class="divide-y divide-gray-100">
                        ${history.length === 0 ? '<tr><td colspan="3" class="p-6 text-center text-gray-400">Nenhuma transação</td></tr>' : ''}
                        ${history.map(tr => {
                            const isCredito = tr.tipo === 'credito';
                            return `
                            <tr class="hover:bg-gray-50">
                                <td class="p-4"><span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold ${isCredito ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}"><i data-lucide="${isCredito ? 'trending-up' : 'trending-down'}" class="w-3 h-3"></i>${isCredito ? 'GANHO' : 'GASTO'}</span></td>
                                <td class="p-4 font-bold text-gray-600 truncate max-w-[150px]">${tr.descricao}</td><td class="p-4 text-right font-black ${isCredito ? 'text-green-600' : 'text-red-600'}">${isCredito ? '+' : '-'} ${fmtCurrency(tr.valor)}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    </div>`;
}

// ============================================
// 6. MODALS
// ============================================
async function modalResetPass(id) {
    showLoading();
    await supabaseClient.from('users').update({ password: '123' }).eq('id', id);
    toast('Senha reposta para: 123');
    hideLoading();
}

function modalFundos(id, tipo) {
    showModal(`
        <h3 class="text-xl font-black text-gray-800 mb-4">${tipo === 'credito' ? t('add_funds') : t('sub_funds')}</h3>
        <div class="space-y-4">
            <input type="number" id="fValor" placeholder="${t('amount')}" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold text-lg">
            <input type="text" id="fDesc" placeholder="${t('reason')}" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl">${t('cancel')}</button>
            <button onclick="execFundos('${id}', '${tipo}')" class="flex-1 py-3 ${tipo === 'credito' ? 'bg-green-500' : 'bg-red-500'} text-white font-bold rounded-xl">${t('confirm')}</button>
        </div>
    `);
}

async function execFundos(id, tipo) {
    const v = parseFloat($('#fValor').value);
    const d = $('#fDesc').value || 'Trans. manual';
    if(!v || v <= 0) return;
    showLoading();
    const u = appState.users.find(x => x.id === id);
    let newSaldo = u.saldo;
    if(tipo === 'credito') newSaldo += v;
    else { newSaldo -= v; } // Removida a trava que limitava o débito, permitindo negativar a conta.
    
    await supabaseClient.from('users').update({ saldo: newSaldo }).eq('id', id);
    await supabaseClient.from('transacoes').insert([{ id: generateId(), aluno_id: id, tipo, valor: v, descricao: d }]);
    toast('Sucesso!'); closeModal(); await refreshData(); hideLoading(); render();
}

function modalAddItem() {
    showModal(`
        <h3 class="text-xl font-black text-gray-800 mb-4">${t('add_item')}</h3>
        <div class="space-y-4">
            <input type="text" id="iNome" placeholder="Nome do Item" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
            <input type="text" id="iDesc" placeholder="Descrição" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
            <input type="number" id="iPreco" placeholder="${t('base_price')}" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl">${t('cancel')}</button>
            <button onclick="execAddItem()" class="flex-1 py-3 bg-ligra-main text-white font-bold rounded-xl">${t('confirm')}</button>
        </div>
    `);
}

async function execAddItem() {
    const nome = $('#iNome').value;
    const desc = $('#iDesc').value;
    const preco = parseFloat($('#iPreco').value);
    if(!nome || !preco) return;
    showLoading();
    await supabaseClient.from('loja').insert([{ id: generateId(), nome, descricao: desc, preco_base: preco }]);
    toast('Item adicionado!'); closeModal(); await refreshData(); hideLoading(); render();
}

render();
</script>
