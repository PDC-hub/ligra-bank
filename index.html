function showLoading() { $('#global-loader').classList.remove('hidden'); }

function toast(msg, type = 'success') {
    const container = $('#toast-container');
    const toast = document.createElement('div');
    const bg = type === 'success' ? 'bg-green-500' : 'bg-red-500';
    toast.className = `${bg} text-white px-6 py-3 rounded-lg shadow-lg font-bold fade-in`;
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 3000);
}

// ============================================
async function handleLogin(e) {
    e.preventDefault();
    const email = $('#loginEmail').value.trim();
    const pass = $('#loginPass').value;
    
    showLoading();
    // Procurar user na tabela customizada 'users'
    const { data: user, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('email', email)
        .eq('password', pass)
        .single();

    if (error || !user) {
        hideLoading();
        toast('Invalid credentials / Credenciais inválidas', 'error');
        return;
    }

    appState.currentUser = user;
    appState.currentView = 'dashboard';
    
    await refreshData();
    hideLoading();
    render();
}

function handleLogout() {
    appState.currentUser = null;
    render();
}

async function refreshData() {
    if (!appState.currentUser) return;
    const uId = appState.currentUser.id;
    const role = appState.currentUser.role;

    try {
        // Puxar a loja (ambos veem)
        const { data: loja } = await supabaseClient.from('loja').select('*');
        appState.loja = loja || [];

        if (role === 'teacher') {
            const { data: users } = await supabaseClient.from('users').select('*').eq('role', 'student');
            appState.users = users || [];

            const { data: transacoes } = await supabaseClient.from('transacoes').select('*');
            appState.transacoes = transacoes || [];

            const { data: solicitacoes } = await supabaseClient.from('solicitacoes_item').select('*');
            appState.solicitacoes = solicitacoes || [];
        } else {
            // Atualizar os dados do próprio aluno
            const { data: user } = await supabaseClient.from('users').select('saldo').eq('id', uId).single();
            if (user) appState.currentUser.saldo = user.saldo;

            const { data: transacoes } = await supabaseClient.from('transacoes').select('*').eq('aluno_id', uId);
            appState.transacoes = transacoes || [];

            const { data: solicitacoes } = await supabaseClient.from('solicitacoes_item').select('*').eq('aluno_id', uId);
            appState.solicitacoes = solicitacoes || [];
        }
    } catch (err) {
        toast('Failed to load data', 'error');
        console.error(err);
    }
}

async function excluirAluno(id) {

    if (confirm('Tem certeza de que deseja excluir este aluno? Esta ação não pode ser desfeita.')) {

        // 2. Apaga o registo do aluno na tabela 'users' do Supabase

            .from('users')
            .delete()
            .eq('id', id);

        if (error) {
            console.error('Erro ao excluir aluno:', error);
            toast('Erro ao excluir aluno do Supabase.', 'error');
        } else {
            toast('Aluno excluído com sucesso!');
        }

        // 3. Recarrega os dados atualizados do banco e redesenha a tela
        await refreshData();
        hideLoading();
        render();
    }
}

async function handleCSVUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    showLoading();
    const reader = new FileReader();
    reader.onload = async function(e) {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);
        let newUsers = [];

        if (lines.length > 0) {
            const delimiter = lines[0].includes(';') ? ';' : ',';
            const headers = lines[0].toLowerCase().split(delimiter).map(h => h?.trim());
            
            let nomeIdx = headers.indexOf('nome');
            let emailIdx = headers.indexOf('email');
            
            // Procura a coluna turma ou grupo
            let turmaIdx = headers.indexOf('turma');
            if (turmaIdx === -1) turmaIdx = headers.indexOf('grupo');
            
            if (nomeIdx === -1) nomeIdx = 0;
            if (emailIdx === -1) emailIdx = 1;

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const cols = lines[i].split(delimiter).map(s => s?.trim());
                const nome = cols[nomeIdx];
                const email = cols[emailIdx];
                const turmaStr = turmaIdx !== -1 ? cols[turmaIdx] : null;

                if (nome && email && email.endsWith('@portalsesisp.org.br')) {
                    newUsers.push({
                        id: generateId(),
                        role: 'student',
                        nome: nome,
                        email: email,
                        password: '123',
                        saldo: 0,
                        turma: turmaStr
                    });
                }
            }
        }

        if(newUsers.length > 0) {
            // Como usamos "await" aqui, a função ali em cima tem de ser "async"
            const { error } = await supabaseClient.from('users').insert(newUsers);
            if(error) {
                console.error('Erro no Supabase:', error);
                toast('Erro ao inserir. Confirme se criou a coluna "turma".', 'error');
            } else {
                toast(`${newUsers.length} alunos importados com sucesso!`);
            }
        } else {
            toast('Nenhum aluno válido com e-mail @portalsesisp foi encontrado.', 'error');
        }
        
        await refreshData();
        hideLoading();
        render();
        
        event.target.value = '';
    };
    reader.readAsText(file);
}

async function handleRequest(reqId, action) {
    showLoading();
    const req = appState.solicitacoes.find(s => s.id === reqId);
    if (!req) { hideLoading(); return; }
    
    // Update request status in DB
    await supabaseClient.from('solicitacoes_item').update({ status: action }).eq('id', reqId);
    
    // Se rejeitado, devolve o dinheiro ao aluno
    if (action === 'rejeitado') {
        const aluno = appState.users.find(u => u.id === req.aluno_id);
        if(aluno) {
            const newSaldo = aluno.saldo + parseFloat(req.preco_pago);
            await supabaseClient.from('users').update({ saldo: newSaldo }).eq('id', aluno.id);
            await supabaseClient.from('transacoes').insert([{
                id: generateId(),
                aluno_id: aluno.id,
                tipo: 'credito',
                valor: req.preco_pago,
                descricao: 'Refund for rejected request'
            }]);
        }
    }
    
    toast(`Request ${action === 'aprovado' ? 'Approved' : 'Denied'}`);
    await refreshData();
    hideLoading();
    render();
}

        <div class="space-y-4">
            <input type="text" id="iNome" placeholder="Item Name" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
            <input type="text" id="iDesc" placeholder="Description" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
            <input type="number" id="iPreco" placeholder="${t('base_price')}" class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 bg-gray-50 outline-none font-bold">
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-600 font-bold rounded-xl">${t('cancel')}</button>
            <button onclick="execAddItem()" class="flex-1 py-3 bg-ligra-main text-white font-bold rounded-xl">${t('confirm')}</button>
        </div>
    `);
}

async function execAddItem() {
    const nome = $('#iNome').value;
    const desc = $('#iDesc').value;
    const preco = parseFloat($('#iPreco').value);
    if(!nome || !preco) return;
    
    showLoading();
    await supabaseClient.from('loja').insert([{ id: generateId(), nome, descricao: desc, preco_base: preco }]);
    
    toast('Item added!'); 
    closeModal();
    await refreshData();
    hideLoading();
    render();
}

// Init (Render Login Screen)
render();
</script>
</body>
</html>
