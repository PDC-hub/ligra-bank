function renderRelatorios() {
  const totalCredito = appState.transacoes.filter(t => t.tipo === 'credito').reduce((s, t) => s + (t.valor || 0), 0);

  // Por turma
  const porTurma = {};
  appState.turmas.forEach(t => {
    const alunosTurma = appState.alunos.filter(a => a.turma_id === t.id);
    porTurma[t.nome] = {

      saldo: alunosTurma.reduce((s, a) => s + (a.saldo || 0), 0)
    };
  });

  return `
    <div class="fade-in">
      <div class="mb-6">

          <p class="text-sm text-gray-500 mb-1">Total Creditado</p>
          <p class="text-2xl font-bold text-green-600">${fmtCurrency(totalCredito)}</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Total Debitado</p>
          <p class="text-2xl font-bold text-red-600">${fmtCurrency(totalDebito)}</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Saldo em Circulação</p>
          <p class="text-2xl font-bold text-blue-600">${fmtCurrency(appState.saldoGeral)}</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
        <div class="p-5 border-b border-gray-100">
          <h3 class="font-bold text-gray-800">Por Turma</h3>
        </div>
        <div class="divide-y divide-gray-50">
          ${Object.entries(porTurma).map(([nome, dados]) => `
            <div class="p-4 flex items-center justify-between">
              <div>
                <p class="font-medium text-gray-800">${nome}</p>
                <p class="text-xs text-gray-400">${dados.alunos} aluno(s)</p>
              </div>
              <p class="font-bold text-gray-800">${fmtCurrency(dados.saldo)}</p>
            </div>
          `).join('')}
          ${Object.keys(porTurma).length === 0 ? '<div class="p-5 text-center text-gray-400">Nenhuma turma</div>' : ''}
        </div>
      </div>

      <button onclick="exportarDados()" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-xl font-medium transition-all btn-press flex items-center gap-2">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0l-4 4m4-4v12"/></svg>
        Exportar Dados (JSON)
      </button>
    </div>
  `;
}

function exportarDados() {
  const dados = {
    professor: appState.professor,
    turmas: appState.turmas,
    alunos: appState.alunos,
    transacoes: appState.transacoes,
    exportado_em: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ligra-bank-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Dados exportados!', 'success');
}

function modalNovaTransacao() {
  showModal(`
    <div class="p-6">
      <h3 class="text-xl font-bold text-gray-800 mb-4">Nova Transação</h3>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
        <select id="transAluno" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-gray-50 focus:border-[#89C2F5] transition-all">
          <option value="">Selecione...</option>
          ${appState.alunos.map(a => `<option value="${a.id}">${a.nome}</option>`).join('')}
        </select>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
        <select id="transTipo" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-gray-50 focus:border-[#89C2F5] transition-all">
          <option value="credito">Crédito (+)</option>
          <option value="debito">Débito (-)</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Valor</label>
        <input type="number" id="transValor" min="0.01" step="0.01" placeholder="0,00" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-gray-50 focus:border-[#89C2F5] transition-all">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
        <input type="text" id="transDesc" placeholder="Motivo da transação" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-gray-50 focus:border-[#89C2F5] transition-all">
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal(this.closest('.modal-overlay'))" class="flex-1 py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-medium hover:bg-gray-50 transition-all">Cancelar</button>
        <button onclick="handleNovaTransacao()" class="flex-1 py-3 rounded-xl bg-[#89C2F5] text-white font-bold hover:bg-[#5B8FB3] transition-all btn-press">Confirmar</button>
      </div>
    </div>
  `);
}

async function handleNovaTransacao() {
  const alunoId = $('#transAluno').value;
  const tipo = $('#transTipo').value;
  const valor = parseFloat($('#transValor').value);
  const desc = $('#transDesc').value.trim();
  if (!alunoId) { toast('Selecione um aluno', 'warning'); return; }
  if (!valor || valor <= 0) { toast('Informe um valor válido', 'warning'); return; }
  await criarTransacao(alunoId, tipo, valor, desc);
  closeModal($('.modal-overlay'));
  renderApp();
}
